<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title description">
  <title id="title">VideoAI Downloader for Windows — Select. Queue. Save.</title>
  <desc id="description">An original blue and teal illustration of media selection, a persistent queue and a saved file. It is not a screenshot or speed benchmark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091728"/><stop offset=".6" stop-color="#10273b"/><stop offset="1" stop-color="#0e1d30"/></linearGradient>
    <radialGradient id="cyan"><stop stop-color="#45bfce" stop-opacity=".18"/><stop offset="1" stop-color="#45bfce" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#57c9e3"/><stop offset="1" stop-color="#4e7fde"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b344c"/><stop offset="1" stop-color="#11273b"/></linearGradient>
  </defs>
  <rect width="1280" height="380" rx="24" fill="url(#background)"/>
  <ellipse cx="980" cy="200" rx="480" ry="290" fill="url(#cyan)"/>
  <g fill="none" stroke="#648faf" stroke-opacity=".09"><path d="M730 0v380M810 0v380M890 0v380M970 0v380M1050 0v380M1130 0v380M1210 0v380M660 70h620M660 150h620M660 230h620M660 310h620"/></g>
  <path d="M1100-30 813 410M1180-30 893 410" stroke="#6ad0de" stroke-opacity=".07" fill="none"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="57" y="50" width="44" height="44" rx="12" fill="url(#accent)"/>
    <path d="M79 60v20m-7-7 7 7 7-7M68 83v4h22v-4" fill="none" stroke="#091d31" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="71" fill="#dbeaf7" font-size="19" font-weight="700">VIDEOAI DOWNLOADER</text>
    <text x="115" y="92" fill="#7599b6" font-size="12" letter-spacing="2">FOR WINDOWS</text>
    <text x="57" y="168" fill="#f0f6fc" font-size="49" font-weight="650" letter-spacing="-1.8">Select. Queue.</text>
    <text x="57" y="224" fill="#7fd7e4" font-size="49" font-weight="650" letter-spacing="-1.8">Save.</text>
    <text x="60" y="267" fill="#9bb7cf" font-size="18">Your media workflow, with room to take control.</text>
    <rect x="58" y="299" width="131" height="30" rx="15" fill="#173149" stroke="#39738d"/>
    <text x="123" y="319" fill="#bce2ef" text-anchor="middle" font-size="12" font-weight="600">WINDOWS x64</text>
    <text x="208" y="319" fill="#799bb7" font-size="12" letter-spacing="1">SETUP + PORTABLE · BUNDLED TOOLS</text>
    <g transform="translate(671 70)">
      <text x="269" y="9" text-anchor="middle" fill="#759ebd" font-size="11" font-weight="600" letter-spacing="2">INSPECT → SELECT → DOWNLOAD</text>
      <rect x="20" y="58" width="219" height="190" rx="17" fill="#081b2b" stroke="#294863"/>
      <rect x="1" y="39" width="219" height="190" rx="17" fill="url(#card)" stroke="#3e6480"/>
      <rect x="20" y="58" width="181" height="62" rx="9" fill="#1d425e"/>
      <circle cx="110" cy="89" r="19" fill="#315c78"/><path d="m105 80 15 9-15 9z" fill="#b0dfed"/>
      <text x="22" y="148" fill="#c4d9ea" font-size="14" font-weight="600">Selected media</text>
      <path d="M22 166h152M22 177h113" stroke="#638aa7" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
      <text x="22" y="207" fill="#729ab8" font-size="11">VIDEO · AUDIO · PLAYLIST</text>
      <path d="M228 133h32m-7-6 7 6-7 6" stroke="#6bc4d6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(275 47)">
        <rect width="235" height="171" rx="15" fill="#112c40" stroke="#4c7a90"/>
        <text x="20" y="32" fill="#d1e5ef" font-size="14" font-weight="600">Persistent queue</text>
        <g fill="#2b5a70"><rect x="19" y="49" width="31" height="31" rx="6"/><rect x="19" y="91" width="31" height="31" rx="6"/></g>
        <g stroke="#7db4c7" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="m30 61 9 5-9 5zM29 102h12M29 108h12M29 114h8"/></g>
        <g stroke="#476e85" stroke-width="4" stroke-linecap="round"><path d="M64 58h127M64 70h98M64 101h115M64 113h141"/></g>
        <path d="M20 145h197" stroke="#416c83" stroke-width="1"/>
        <text x="117" y="161" text-anchor="middle" fill="#7bafc1" font-size="10" letter-spacing="1">PAUSE · RESUME · RETRY</text>
      </g>
      <g transform="translate(417 236)">
        <rect width="112" height="49" rx="11" fill="#28554f" stroke="#529689"/>
        <path d="m17 25 5 5 10-12" stroke="#9be0cd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="30" fill="#c2ebe0" font-size="12" font-weight="600">Your files</text>
      </g>
    </g>
    <text x="946" y="346" text-anchor="middle" fill="#6c92af" font-size="11" letter-spacing="1.6">ORIGINAL WORKFLOW ILLUSTRATION</text>
  </g>
